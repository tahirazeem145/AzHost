spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:azhosttestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

server:
  port: 0

azhost:
  github:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/github/callback
    api-base-url: https://api.github.com
    oauth-url: https://github.com/login/oauth
  security:
    github-token-encryption-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef



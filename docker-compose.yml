version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: azhost-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-azhost}
      POSTGRES_USER: ${POSTGRES_USER:-azhost_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azhost_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azhost_user} -d ${POSTGRES_DB:-azhost}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: azhost-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-azhost}
      DATABASE_USERNAME: ${POSTGRES_USER:-azhost_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-azhost_password}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: azhost-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
